[project]
name = "habit-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "Georgy",email = "girt80@yandex.ru"}
]
requires-python = "^3.14"
dependencies = [
    "django (>=6.0,<6.1)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "ipython (>=9.18.1,<10.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "celery (>=5.7.0,<6.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
linters = [
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "mypy (>=2.4.1,<3.0.0)"
]
